# XcodeGen-Projektdefinition – `xcodegen generate` erzeugt HealthWake.xcodeproj
name: HealthWake
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  HealthWake:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources
      - Assets.xcassets
    scheme:
      testTargets:
        - HealthWakeTests
    settings:
      base:
        # Platzhalter fuer lokale Builds. Der GitHub-Build setzt
        # automatisch com.<TEAMID>.healthwake (oder die Variable BUNDLE_ID).
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthwake
        PRODUCT_NAME: HealthWake
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    # Wird von XcodeGen erzeugt; project.yml bleibt die einzige Quelle.
    # background-delivery hat keine eigene Capability bei Apple, sondern
    # wird mit der HealthKit-Capability der Bundle-ID gewaehrt.
    entitlements:
      path: HealthWake.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: HealthWake
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Basissprache der Oberflaeche. Wird zum Bezugspunkt, sobald
        # weitere Sprachen dazukommen.
        CFBundleDevelopmentRegion: en
        # Diese Texte zeigt iOS im Berechtigungsdialog -- also in der
        # Sprache der Oberflaeche, nicht in der des Quelltextes.
        NSHealthShareUsageDescription: >-
          HealthWake watches the health types you select and runs your
          configured actions whenever a new entry arrives.
        # Pflicht, sobald das HealthKit-Entitlement gesetzt ist -- altool
        # prueft statisch und weist den Upload sonst mit 90683 zurueck,
        # auch wenn die App nie schreibt. Der Text wird deshalb nie
        # angezeigt: requestAuthorization wird nur mit read aufgerufen.
        NSHealthUpdateUsageDescription: >-
          HealthWake never writes to Health. It only reads the entries
          you select.

  # Unit-Tests laufen im Simulator im App-Prozess (TEST_HOST), damit
  # @testable import HealthWake das App-Modul sieht.
  HealthWakeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Tests
    dependencies:
      - target: HealthWake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.healthwake.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
